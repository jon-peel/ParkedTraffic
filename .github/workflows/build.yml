name: Build

# Every push to main builds the exe (downloadable from the run's "Artifacts").
# Pushing a tag like v1.0.0 also publishes it as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build trimmed single-file exe
        shell: pwsh
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ParkedTraffic-win-x64
          path: dist/ParkedTraffic.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # Both the plain exe (download and run) and a zip of it.
        run: gh release create "${{ github.ref_name }}" dist/ParkedTraffic.exe dist/ParkedTraffic-win-x64.zip --title "ParkedTraffic ${{ github.ref_name }}" --generate-notes
